# BankFlow Grafana dashboard, kept as code. The Grafana sidecar loads every ConfigMap
# with the label grafana_dashboard: "1", in any namespace.
apiVersion: v1
kind: ConfigMap
metadata:
  name: bankflow-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  bankflow-services.json: |
    {
      "uid": "bankflow-overview",
      "title": "BankFlow - Services",
      "tags": ["bankflow"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "10s",
      "time": {"from": "now-30m", "to": "now"},
      "editable": true,
      "templating": {"list": []},
      "annotations": {"list": []},
      "panels": [
        {"id": 1, "type": "stat", "title": "Services up", "datasource": {"type": "prometheus", "uid": "prometheus"}, "gridPos": {"x": 0, "y": 0, "w": 6, "h": 4}, "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "value"}, "fieldConfig": {"defaults": {"thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "green", "value": 4}]}}, "overrides": []}, "targets": [{"refId": "A", "datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "sum(up{namespace=\"bankflow\", job=~\".*-service\"})"}]},
        {"id": 2, "type": "stat", "title": "Pod restarts (last hour)", "datasource": {"type": "prometheus", "uid": "prometheus"}, "gridPos": {"x": 6, "y": 0, "w": 6, "h": 4}, "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "value"}, "fieldConfig": {"defaults": {"thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "red", "value": 1}]}, "decimals": 0}, "overrides": []}, "targets": [{"refId": "A", "datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "sum(increase(kube_pod_container_status_restarts_total{namespace=\"bankflow\"}[1h]))"}]},
        {"id": 3, "type": "stat", "title": "HTTP 5xx (last 5 min)", "datasource": {"type": "prometheus", "uid": "prometheus"}, "gridPos": {"x": 12, "y": 0, "w": 6, "h": 4}, "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "value"}, "fieldConfig": {"defaults": {"thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "red", "value": 1}]}, "decimals": 0}, "overrides": []}, "targets": [{"refId": "A", "datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "sum(increase(http_server_requests_seconds_count{namespace=\"bankflow\", status=~\"5..\"}[5m])) or vector(0)"}]},
        {"id": 4, "type": "stat", "title": "Requests / s", "datasource": {"type": "prometheus", "uid": "prometheus"}, "gridPos": {"x": 18, "y": 0, "w": 6, "h": 4}, "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "value"}, "fieldConfig": {"defaults": {"unit": "reqps", "decimals": 2}, "overrides": []}, "targets": [{"refId": "A", "datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "sum(rate(http_server_requests_seconds_count{namespace=\"bankflow\", uri!~\"/actuator.*\"}[$__rate_interval])) or vector(0)"}]},
        {"id": 5, "type": "timeseries", "title": "Requests per second", "datasource": {"type": "prometheus", "uid": "prometheus"}, "gridPos": {"x": 0, "y": 4, "w": 12, "h": 8}, "fieldConfig": {"defaults": {"unit": "reqps"}, "overrides": []}, "options": {"legend": {"displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "multi"}}, "targets": [{"refId": "A", "datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "sum by (service) (rate(http_server_requests_seconds_count{namespace=\"bankflow\", uri!~\"/actuator.*\"}[$__rate_interval]))", "legendFormat": "{{service}}"}]},
        {"id": 6, "type": "timeseries", "title": "HTTP 5xx per second", "datasource": {"type": "prometheus", "uid": "prometheus"}, "gridPos": {"x": 12, "y": 4, "w": 12, "h": 8}, "fieldConfig": {"defaults": {"unit": "reqps"}, "overrides": []}, "options": {"legend": {"displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "multi"}}, "targets": [{"refId": "A", "datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "sum by (service) (rate(http_server_requests_seconds_count{namespace=\"bankflow\", status=~\"5..\"}[$__rate_interval]))", "legendFormat": "{{service}}"}]},
        {"id": 7, "type": "timeseries", "title": "Latency p95", "datasource": {"type": "prometheus", "uid": "prometheus"}, "gridPos": {"x": 0, "y": 12, "w": 12, "h": 8}, "fieldConfig": {"defaults": {"unit": "s"}, "overrides": []}, "options": {"legend": {"displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "multi"}}, "targets": [{"refId": "A", "datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "histogram_quantile(0.95, sum by (service, le) (rate(http_server_requests_seconds_bucket{namespace=\"bankflow\", uri!~\"/actuator.*\"}[$__rate_interval])))", "legendFormat": "{{service}}"}]},
        {"id": 8, "type": "timeseries", "title": "Latency p99", "datasource": {"type": "prometheus", "uid": "prometheus"}, "gridPos": {"x": 12, "y": 12, "w": 12, "h": 8}, "fieldConfig": {"defaults": {"unit": "s"}, "overrides": []}, "options": {"legend": {"displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "multi"}}, "targets": [{"refId": "A", "datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "histogram_quantile(0.99, sum by (service, le) (rate(http_server_requests_seconds_bucket{namespace=\"bankflow\", uri!~\"/actuator.*\"}[$__rate_interval])))", "legendFormat": "{{service}}"}]},
        {"id": 9, "type": "timeseries", "title": "JVM heap used", "datasource": {"type": "prometheus", "uid": "prometheus"}, "gridPos": {"x": 0, "y": 20, "w": 12, "h": 8}, "fieldConfig": {"defaults": {"unit": "bytes"}, "overrides": []}, "options": {"legend": {"displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "multi"}}, "targets": [{"refId": "A", "datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "sum by (service) (jvm_memory_used_bytes{namespace=\"bankflow\", area=\"heap\"})", "legendFormat": "{{service}}"}]},
        {"id": 10, "type": "timeseries", "title": "DB connections in use (Hikari)", "datasource": {"type": "prometheus", "uid": "prometheus"}, "gridPos": {"x": 12, "y": 20, "w": 12, "h": 8}, "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []}, "options": {"legend": {"displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "multi"}}, "targets": [{"refId": "A", "datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "sum by (service) (hikaricp_connections_active{namespace=\"bankflow\"})", "legendFormat": "{{service}}"}]}
      ]
    }