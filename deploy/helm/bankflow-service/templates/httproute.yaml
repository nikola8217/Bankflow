{{- if .Values.route.pathPrefix }}
# Exposes only the public API of the service through the Gateway.
# /actuator and /internal are not matched, so they stay reachable inside the cluster only.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "bankflow-service.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.route.gateway }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.route.pathPrefix }}
      backendRefs:
        - name: {{ .Release.Name }}
          port: {{ .Values.port }}
  {{- end }}