spring.application.name=auth-service
server.port=8081

# Database (defaults point to docker compose, for running the service from the IDE)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/auth_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Security: no default secret, the service must not start with a known signing key
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# API docs
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Actuator: health for Docker/Kubernetes probes, metrics for Prometheus. Nothing else is exposed.
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true

# Histogram buckets for HTTP requests, so Prometheus can calculate p95/p99 latency.
management.metrics.distribution.percentiles-histogram.http.server.requests=true