spring.application.name=transaction-service
server.port=8083

# Database (defaults point to docker compose, for running the service from the IDE)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/transaction_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Kafka (9094 is the listener for the host; containers get kafka:9092 from the environment)
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9094}

# Security: no default secrets, the service must not start with known keys
jwt.secret=${JWT_SECRET}
internal.api-key=${INTERNAL_API_KEY}

# Account service client
account.service.url=${ACCOUNT_SERVICE_URL:http://localhost:8082}
account.service.connect-timeout=2s
account.service.read-timeout=3s

# API docs
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Actuator: health for Docker/Kubernetes probes, metrics for Prometheus. Nothing else is exposed.
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true

# Histogram buckets for HTTP requests, so Prometheus can calculate p95/p99 latency.
management.metrics.distribution.percentiles-histogram.http.server.requests=true