image:
  repository: ""
  # Git SHA of the commit the image was built from; set per install (never "latest").
  tag: ""
  pullPolicy: IfNotPresent

replicaCount: 1

# Port the service listens on (server.port); the Kubernetes Service uses the same port.
port: 8080

# Plain configuration, rendered into a ConfigMap and passed as environment variables.
# Keys from a service's values file are merged with these defaults.
env:
  # One JSON object per log line in the cluster, so Loki can filter by field; local runs keep plain text.
  LOGGING_STRUCTURED_FORMAT_CONSOLE: logstash

# Secret configuration: environment variable -> key in the Secret named by appSecret.
appSecret: bankflow-app
secretEnv: {}

# Database: URL goes to the ConfigMap, username/password come from this Secret.
database:
  url: ""
  credentialsSecret: bankflow-db

# Prometheus scraping of /actuator/prometheus (needs the Prometheus Operator CRDs).
metrics:
  enabled: true
  interval: 15s

# Public route through the Gateway; empty = no HTTPRoute.
route:
  gateway: bankflow
  pathPrefix: ""

# The image sets -XX:MaxRAMPercentage=75, so the JVM heap follows the memory limit.
resources:
  requests:
    memory: 384Mi
    cpu: 100m
  limits:
    memory: 1Gi