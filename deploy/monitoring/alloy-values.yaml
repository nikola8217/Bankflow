# Values for the Grafana Alloy chart: collects the logs of every pod in the bankflow namespace
# through the Kubernetes API and pushes them to Loki.
controller:
  # Logs are read through the API server, so one instance is enough (a DaemonSet would duplicate them).
  type: deployment
  replicas: 1

alloy:
  configMap:
    content: |
      // Find the pods of the application.
      discovery.kubernetes "pods" {
        role = "pod"
        namespaces {
          names = ["bankflow"]
        }
      }

      // Turn Kubernetes metadata into Loki labels (few, low-cardinality values).
      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          target_label  = "app"
        }
      }

      loki.source.kubernetes "pods" {
        targets    = discovery.relabel.pods.output
        forward_to = [loki.process.pods.receiver]
      }

      // The services log JSON (logstash format); promote the level to a label for fast filtering.
      loki.process "pods" {
        stage.json {
          expressions = { level = "level" }
        }
        stage.labels {
          values = { level = "" }
        }
        forward_to = [loki.write.default.receiver]
      }

      loki.write "default" {
        endpoint {
          url = "http://loki.monitoring.svc:3100/loki/api/v1/push"
        }
      }