name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.service }})

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service: [auth-service, account-service, transaction-service, ledger-service]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: 'api/**/pom.xml'

      - name: Install shared module
        working-directory: api/shared
        run: mvn -B install -DskipTests

      - name: Run tests
        working-directory: api/${{ matrix.service }}
        run: |
          chmod +x mvnw
          ./mvnw -B test

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.service }}
          path: api/${{ matrix.service }}/target/surefire-reports