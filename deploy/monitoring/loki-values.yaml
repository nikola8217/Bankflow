# Values for the Loki chart (grafana-community), as one small process with local disk storage.
deploymentMode: Monolithic

loki:
  # Single tenant: no X-Scope-OrgID header needed when pushing or querying.
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

singleBinary:
  replicas: 1
  persistence:
    size: 5Gi
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 512Mi

# Not needed for a single small instance; each would add pods and memory.
gateway:
  enabled: false
chunksCache:
  enabled: false
resultsCache:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false

read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0