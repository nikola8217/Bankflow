# Kafka managed by the Strimzi operator (KRaft, no Zookeeper).
# One node that is both controller and broker, like docker-compose; scale by raising replicas.
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: dual-role
  namespace: bankflow
  labels:
    strimzi.io/cluster: bankflow
spec:
  replicas: 1
  roles:
    - controller
    - broker
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 5Gi
        kraftMetadata: shared
  resources:
    requests:
      memory: 1Gi
      cpu: 250m
    limits:
      memory: 1Gi
  jvmOptions:
    "-Xms": 512m
    "-Xmx": 512m
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: bankflow
  namespace: bankflow
spec:
  kafka:
    version: 4.3.1
    metadataVersion: 4.3-IV0
    listeners:
      # Services connect to bankflow-kafka-bootstrap:9092 inside the cluster.
      - name: plain
        port: 9092
        type: internal
        tls: false
    config:
      # Single broker, so every topic has one replica.
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      default.replication.factor: 1
      min.insync.replicas: 1
      # Same as docker-compose: services declare their topics, a typo must fail.
      auto.create.topics.enable: false